<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #05021a;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    .overlay {
      position: absolute;
      top: 5%;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
    h1 {
      font-size: 2.2rem;
      color: #ff3366;
      text-shadow: 0 0 12px rgba(255, 51, 102, 0.8);
      margin-bottom: 6px;
    }
    p {
      font-size: 1rem;
      color: #d1d5db;
      margin-bottom: 12px;
    }
    .timer-box {
      display: inline-flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
    }
    .time-unit {
      text-align: center;
      min-width: 50px;
    }
    .time-unit span {
      display: block;
      font-size: 1.4rem;
      font-weight: bold;
      color: #ff6699;
    }
    .time-unit label {
      font-size: 0.7rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="overlay">
    <h1>Happy Birthday! ❤️</h1>
    <p>Time passed since you entered the world:</p>
    <div class="timer-box">
      <div class="time-unit"><span id="days">00</span><label>DAYS</label></div>
      <div class="time-unit"><span id="hours">00</span><label>HOURS</label></div>
      <div class="time-unit"><span id="mins">00</span><label>MINS</label></div>
      <div class="time-unit"><span id="secs">00</span><label>SECS</label></div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    // Set your target birthdate here
    const birthDate = new Date("2004-08-26T00:00:00");

    function updateTimer() {
      const diff = new Date() - birthDate;
      document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById("hours").innerText = Math.floor((diff / (1000 * 60 * 60)) % 24).toString().padStart(2, '0');
      document.getElementById("mins").innerText = Math.floor((diff / (1000 * 60)) % 60).toString().padStart(2, '0');
      document.getElementById("secs").innerText = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    // Canvas animation setup
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Heart curve math function
    function getHeartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    const particles = [];
    const particleCount = 220;
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2 + 30;
    const scale = Math.min(canvas.width, canvas.height) / 38;

    for (let i = 0; i < particleCount; i++) {
      const step = (Math.PI * 2 / particleCount) * i;
      const point = getHeartPoint(step);
      particles.push({
        x: centerX + point.x * scale,
        y: centerY + point.y * scale,
        baseX: centerX + point.x * scale,
        baseY: centerY + point.y * scale,
        size: Math.random() * 2.5 + 1.5,
        color: `hsl(${340 + Math.random() * 30}, 100%, ${60 + Math.random() * 20}%)`,
        speed: Math.random() * 0.05 + 0.02,
        offset: Math.random() * Math.PI * 2
      });
    }

    // Branch drawing logic for tree trunk base
    function drawTrunk() {
      ctx.beginPath();
      ctx.strokeStyle = '#4a2e18';
      ctx.lineWidth = 10;
      ctx.moveTo(canvas.width / 2, canvas.height);
      ctx.quadraticCurveTo(canvas.width / 2, centerY + 80, canvas.width / 2, centerY + 40);
      ctx.stroke();
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 2, 26, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawTrunk();

      particles.forEach(p => {
        p.offset += p.speed;
        p.x = p.baseX + Math.sin(p.offset) * 4;
        p.y = p.baseY + Math.cos(p.offset) * 4;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
