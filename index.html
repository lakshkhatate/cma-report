<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #08081a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Floating Header & Counter */
    .container {
      text-align: center;
      z-index: 10;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 2.5rem;
      color: #ff4b72;
      text-shadow: 0 0 10px rgba(255, 75, 114, 0.7);
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 1.1rem;
      color: #e0e0e0;
      margin-bottom: 15px;
    }
    .timer {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    .time-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 15px;
      border-radius: 8px;
      min-width: 70px;
    }
    .time-box span {
      display: block;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ff758c;
    }
    .time-box label {
      font-size: 0.75rem;
      color: #ccc;
      text-transform: uppercase;
    }

    /* Canvas Animation */
    canvas {
      z-index: 1;
    }

    /* Background Floating Elements */
    .balloon, .heart {
      position: absolute;
      bottom: -100px;
      opacity: 0.8;
      animation: floatUp 8s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-115vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Happy Birthday! ❤️</h1>
    <p class="subtitle">Time since you came into this world:</p>
    <div class="timer">
      <div class="time-box"><span id="days">00</span><label>Days</label></div>
      <div class="time-box"><span id="hours">00</span><label>Hours</label></div>
      <div class="time-box"><span id="minutes">00</span><label>Minutes</label></div>
      <div class="time-box"><span id="seconds">00</span><label>Seconds</label></div>
    </div>
  </div>

  <canvas id="treeCanvas" width="500" height="400"></canvas>

  <!-- Optional Background Audio -->
  <audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <script>
    /* --- 1. BIRTHDATE TIMER CONFIGURATION --- */
    // Change this date to match your crush's birthdate (YYYY-MM-DDTHH:MM:SS)
    const birthDate = new Date("2004-08-26T00:00:00");

    function updateCounter() {
      const now = new Date();
      const diff = now - birthDate;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").innerText = String(days).padStart(2, '0');
      document.getElementById("hours").innerText = String(hours).padStart(2, '0');
      document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
      document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
    }
    setInterval(updateCounter, 1000);
    updateCounter();

    /* --- 2. CANVAS HEART-TREE ANIMATION --- */
    const canvas = document.getElementById("treeCanvas");
    const ctx = canvas.getContext("2d");

    let branchCount = 0;
    const maxBranches = 80;

    function drawBranch(startX, startY, len, angle, branchWidth) {
      ctx.beginPath();
      ctx.save();
      ctx.strokeStyle = "#5a3d28";
      ctx.lineWidth = branchWidth;
      ctx.translate(startX, startY);
      ctx.rotate(angle * Math.PI / 180);
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -len);
      ctx.stroke();

      if (len < 10) {
        drawHeartLeaf(0, -len);
        ctx.restore();
        return;
      }

      setTimeout(() => {
        drawBranch(0, -len, len * 0.8, -15, branchWidth * 0.7);
        drawBranch(0, -len, len * 0.8, 15, branchWidth * 0.7);
      }, 50);

      ctx.restore();
    }

    function drawHeartLeaf(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = "#ff4b72";
      ctx.beginPath();
      ctx.arc(-3, -3, 4, 0, Math.PI * 2);
      ctx.arc(3, -3, 4, 0, Math.PI * 2);
      ctx.lineTo(0, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Start drawing trunk
    drawBranch(250, 400, 70, 0, 8);

    /* --- 3. FLOATING BALLOONS & HEARTS --- */
    function createFloatingElement() {
      const el = document.createElement("div");
      const isHeart = Math.random() > 0.5;
      
      el.className = isHeart ? "heart" : "balloon";
      el.innerHTML = isHeart ? "❤️" : "🎈";
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = (Math.random() * 20 + 20) + "px";
      el.style.animationDuration = (Math.random() * 4 + 5) + "s";
      
      document.body.appendChild(el);

      setTimeout(() => {
        el.remove();
      }, 9000);
    }
    setInterval(createFloatingElement, 400);

    // Play music on first click (browser policy requirement)
    window.addEventListener("click", () => {
      const audio = document.getElementById("bgMusic");
      if (audio.paused) audio.play();
    }, { once: true });
  </script>
</body>
</html>
